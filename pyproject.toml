[project]
name = "porte"
version = "0.1.0"
description = "Ouverture de la porte via la scanette"
authors = [{ name = "Vincent Bisserié", email = "vbisserie@protonmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyudev>=0.24.0",
    "RPi.GPIO>=0.7.1",
    "requests>=2.28.2",
    "sentry-sdk>=1.15.0",
    "dotmap>=1.3.30",
    "ruamel.yaml>=0.17.21",
    "tinydb>=4.7.1",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
